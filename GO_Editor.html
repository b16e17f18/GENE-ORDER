function safeText(value,fallback=''){return value==null||String(value).trim()===''?fallback:String(value).trim()}

function passiveContext(){
  const elements=new Map((db.element?.rows??[]).map(r=>[r.element_id,r]));

  return {elements,statuses,fields:new Map([...(db.battle_effect?.rows??[]).map(r=>[r.battle_effect_id,r]),...(db.form?.rows??[]).map(r=>[r.form_id,r])]),catalog:geneOrderPassives.readTypes(db.passive_type?.rows??[])};
}
function passiveDefinition(slot){const c=passiveContext(),id=draft?.['passive_type'+slot];return {c,definition:c.catalog.types.get(c.catalog.aliases.get(id)??id)}}
function passiveTargets(slot){
  const {c,definition}=passiveDefinition(slot);const options=new Map();if(!definition)return options;

  const labels={pa:'物理攻撃',pd:'物理防御',sa:'特殊攻撃',sd:'特殊防御',sp:'敏捷',all:'すべて',en:'EN',hp:'HP'};
  const candidates=new Set(['used_element','power_lte','auto','none','all','en','hp','hp_full_once','physical','special','status','attack',...stats,...stats.map(s=>s+'_down'),...c.elements.keys(),...c.statuses,...c.fields.keys()]);

}
function refreshPassiveTargets(slot){for(const field of ['target_id'+slot,'condition'+slot]){const dl=$('opt_'+field);if(!dl)continue;dl.replaceChildren();for(const [value,label]of choices(field)??[]){const option=el('option');option.value=value;option.label=label;dl.append(option)}}}
function passiveErrors(row){if(!db.passive_type?.rows.length)return [];const {elements,statuses,catalog,fields}=passiveContext();const passive=geneOrderPassives.normalize(row,elements,statuses,catalog,fields);return [...catalog.issues,...passive.issues,...passive.unconfigured.map(e=>({field:'passive_type'+e.slot,value:'未設定の枠に対象または効果量があります'}))].map(e=>e.field+': '+e.value)}

const schemas={form:'form_id,character_id,name,trigger_type,trigger_value,hp,pa,pd,sa,sd,sp,regen_value,evasion_percent,cost_charge,image_id,hp_change_mode,once_per_battle,persist_on_switch',character:'character_id,name,element_1,element_2,species_id,hp,phy_atk,phy_def,sp_atk,sp_def,speed,evasion_percent,regen_value,cost_charge,slot,skill_1,skill_2,skill_3,skill_4,image,transparent_color,tolerance,render_offset_x,render_offset_y,battle_anchor_x,battle_anchor_y,display_order,ai_type,ai_setup_skill,ai_main_skill,passive_id,content_scope',skill:'skill_id,name,category,power,element,element2,attack_type,hit_type,effect1,effect_target1,effect_chance1,effect2,effect_target2,effect_chance2,effect3,effect_target3,effect_chance3,battle_effect1,battle_effect_chance1,battle_effect2,battle_effect_chance2,target,priority,cost,text,animation_id,animation_duration_ms,repeat_count,power_rule,power_cap,learn_species,learn_elemenr,learn_character,sub_color,attack_stat',passive:'passive_id,name,passive_type1,target_id1,value1,passive_type2,target_id2,value2,passive_type3,target_id3,value3,text,trigger_text1,trigger_text2,trigger_text3,condition1,condition2,condition3',character_skill:'character_id,skill_id',effect:'effect_id,name,effect_group,damage_type,damage_value,turn,can_move,target_stat,start_text,start_delay,stat_modifier_target,stat_modifier_multiplier,action_failure_chance,element,zero_multiplier,max_multiplier',battle_effect:'battle_effect_id,name,battle_effect_group,damage_type,damage_value,turn,can_move,guard_type,weak_hit_type,damage_cut,start_text,start_delay,element,modifier,hp_cost_ratio,decoy_hp_ratio,max_uses,field_target,breakthrough_element,breakthrough_multiplier,field_clearable'};
const editable=Object.keys(schemas), refs=['element','species','animation','power_rule','element_effectiveness','passive_type'];const db={};for(const [k,v] of Object.entries(schemas))db[k]={headers:v.split(','),rows:[],bom:false,eol:'\n',dirty:false};let tab='character',selected=-1,draft=null;const $=id=>document.getElementById(id);const msg=s=>$('msg').textContent=s;const el=(tag,text)=>{let e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e};
function parse(raw){let bom=raw.charCodeAt(0)===65279;if(bom)raw=raw.slice(1);let rows=[],row=[],field='',q=false,closed=false;for(let i=0;i<raw.length;i++){let c=raw[i];if(q){if(c==='"'){if(raw[i+1]==='"'){field+='"';i++}else{q=false;closed=true}}else field+=c;continue}if(closed&&!['\r','\n',','].includes(c))throw Error('引用符の後に不正な文字');if(c==='"'){if(field)throw Error('不正な引用符');q=true}else if(c===','){row.push(field);field='';closed=false}else if(c==='\r'||c==='\n'){if(c==='\r'&&raw[i+1]==='\n')i++;row.push(field);rows.push(row);row=[];field='';closed=false}else field+=c}if(q)throw Error('引用符が閉じていません');if(row.length||field||closed){row.push(field);rows.push(row)}rows=rows.filter(r=>r.some(v=>v!==''));let headers=rows.shift();if(!headers||new Set(headers).size!==headers.length||headers.some(x=>!x))throw Error('ヘッダー不正');if(rows.some(r=>r.length!==headers.length))throw Error('列数不一致');return {headers,rows:rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]]))),bom,eol:raw.includes('\r\n')?'\r\n':'\n',dirty:false,original:(bom?'\ufeff':'')+raw}}
function serialize(d){if(!d.dirty&&d.original!==undefined)return d.original;let esc=v=>{v=String(v??'');return /[",\r\n]/.test(v)?'"'+v.replaceAll('"','""')+'"':v};return (d.bom?'\ufeff':'')+[d.headers.map(esc).join(','),...d.rows.map(r=>d.headers.map(h=>esc(r[h])).join(','))].join(d.eol)+d.eol}
function lookup(f){if(/^passive_type[123]$/.test(f))return ['passive_type','passive_type_id'];if(/^skill_[1-4]$|^ai_(setup|main)_skill$|^skill_id$/.test(f)&&!(f==='skill_id'&&tab==='skill'))return ['skill','skill_id'];if(f==='character_id'&&['character_skill','form'].includes(tab))return ['character','character_id'];if(f==='passive_id'&&tab!=='passive')return ['passive','passive_id'];if(/^effect[123]$/.test(f))return ['effect','effect_id'];if(/^battle_effect[12]$/.test(f))return ['battle_effect','battle_effect_id'];if(f==='breakthrough_element'||(f==='element'&&['effect','battle_effect'].includes(tab)))return ['element','element_id'];if(/^element(_[12]|2)?$/.test(f))return ['element','name'];if(f==='species_id')return ['species','name'];if(f==='animation_id')return ['animation','animation_id'];if(f==='power_rule')return ['power_rule','power_rule_group'];return null}
function choices(f){
  if(tab==='passive'&&/^target_id[123]$/.test(f)&&db.passive_type?.rows.length)return passiveTargets(f.slice(-1));
  if(tab==='passive'&&/^condition[123]$/.test(f)&&db.passive_type?.rows.length){const {c,definition}=passiveDefinition(f.slice(-1));if(definition?.condition_kind==='status_condition')return new Map(['all',...c.statuses].map(v=>[v,v]));if(definition?.condition_kind==='priority_condition'){
    if(draft?.['target_id'+f.slice(-1)]==='power_lte'){const opts=new Map([['60','基本威力60以下']]);for(const row of db.passive.rows)for(const slot of [1,2,3])if(row['target_id'+slot]==='power_lte'&&/^\d+$/.test(row['condition'+slot]??''))opts.set(row['condition'+slot], '基本威力'+row['condition'+slot]+'以下');return opts;}
    const opts=new Map([['','無条件'],['self_hp_lte:1/2','HP半分以下'],['self_hp_lte:1/3','HP1/3以下'],['self_hp_eq:1/1','HP最大'],['status','状態異常'],['first_move_after_entry','登場後最初の技'],['once_per_battle','戦闘中1回'],['self_hp_reached_lte:1/2&once_per_battle','一度HP半分以下になった後・戦闘中1回']]);
    for(const row of db.passive.rows)for(const slot of [1,2,3]){const value=row['condition'+slot];if(value&&definition.condition(value,c.elements,c.statuses)&&!opts.has(value))opts.set(value,value)}return opts;
  }if(definition?.condition_kind==='stat_condition'){
    const opts=new Map([['','無条件'],['self_hp_eq:1/1','自分のHPが最大'],['self_hp_lte:1/2','自分のHPが50%以下'],['opponent_hp_lte:1/3','相手のHPが1/3以下'],['status','自分が状態異常']]);
    for(const row of db.passive.rows)for(const slot of [1,2,3]){const value=row['condition'+slot];if(value&&definition.condition(value,c.elements,c.statuses)&&!opts.has(value))opts.set(value,value)}return opts;
  }}
  if(tab==='form'){
    if(f==='trigger_type')return new Map([['passive','パッシブ条件'],['element_change','現在の第1属性に連動']]);
    if(f==='trigger_value'&&draft?.trigger_type==='element_change')return new Map((db.element?.rows??[]).map(r=>[r.element_id,r.name]));
    if(f==='hp_change_mode')return new Map([['','現在HPを維持'],['preserve_current_hp','現在HPを維持'],['add_max_hp_difference','最大HPの差分を現在HPへ加算']]);

  }

    let v=r[ref[1]];
    if(v)opts.set(v,ref[0]==='passive_type'?[r.name&&r.name!==v?`${r.name} — ${v}`:v,r.description].filter(Boolean).join('｜'):r.name&&r.name!==v?`${r.name} — ${v}`:v)
  }
  let categorical=/^(category|attack_type|hit_type|target|effect_target\d|effect_group|battle_effect_group|field_target|field_clearable|damage_type|target_stat|can_move|stat_modifier_target|passive_type\d|target_id\d|condition\d|ai_type|attack_stat|element.*|species_id|power_rule|learn_.*|sub_color)$/;
  if(ref||categorical.test(f)){

    if(f==='effect_target1'||f==='effect_target2'||f==='effect_target3')for(let v of ['self','enemy'])opts.set(v,v);

    if(f==='target_stat')for(let v of ['en','cost_charge','hp','phy_atk','phy_def','sp_atk','sp_def','speed'])opts.set(v,v);

    }

      let prefix=f.replace(/\d$/,'');
      for(let r of db[tab].rows)for(let k of [1,2,3])if(r[prefix+k]&&!opts.has(r[prefix+k]))opts.set(r[prefix+k],r[prefix+k])
    }

  }

}
function list(){let d=db[tab],q=$('search').value.toLowerCase();$('list').replaceChildren();let n=0;d.rows.forEach((r,i)=>{if(!Object.values(r).join(' ').toLowerCase().includes(q))return;n++;let b=el('button',`${r.name||r[d.headers[0]]} ${r.name?'· '+r[d.headers[0]]:r.skill_id||''}`);if(i===selected)b.className='active';b.onclick=()=>openRow(i);$('list').append(b)});$('count').textContent=`${n} / ${d.rows.length} 件${d.dirty?' • 変更あり':''}`}
function openRow(i,copy=false){selected=copy?-1:i;draft=i<0?Object.fromEntries(db[tab].headers.map(h=>[h,''])):{...db[tab].rows[i]};if(copy)draft[db[tab].headers[0]]='';renderForm();list()}

function renderFormExtras(){if(tab!=='form'||!draft)return;document.getElementById('form-extra')?.remove();const box=el('div');box.id='form-extra';$('form').append(box);const compare=formComparison(draft);if(compare){box.append(el('h3','通常フォルムとの比較'));const table=el('table'),head=el('tr');for(const text of ['能力','通常','フォルム'])head.append(el('th',text));table.append(head);for(const row of compare.values){const tr=el('tr');for(const v of [row.key,row.original,row.value]){const cell=el('td',String(v));cell.style.padding='4px 16px 4px 0';tr.append(cell)}table.append(tr)}box.append(table);box.append(el('p','基礎6能力合計: '+compare.total))}else box.append(el('p','character.csvを読み込むと能力値を比較できます。'));if(draft.trigger_type==='passive'){box.append(el('p','発動条件の正本はpassive.csvです。ここで編集すると対応するcondition列を更新します。保存時はpassive.csvも出力してください。'));const links=formConditionLinks(draft);if(!links.length)box.append(el('p','パッシブのform_changeのtarget_idにこのform_idを設定してください。'));for(const {passive,slot}of links){const label=el('label',passive.name+' condition'+slot),input=el('input');input.value=passive['condition'+slot]??'';input.oninput=()=>{passive['condition'+slot]=input.value;db.passive.dirty=true};label.append(input);box.append(label)}}if(draft.image_id){const image=el('img');image.src=characterImagePath(draft.image_id);image.alt=draft.name||'フォルム画像';image.style.cssText='max-width:240px;max-height:240px;object-fit:contain';image.onerror=()=>{box.append(el('p','画像が見つかりません: '+draft.image_id))};box.append(image)}}
function renderForm(){let d=db[tab],w=editable.includes(tab);$('heading').textContent=tab+'.csv — '+(selected<0?'新規登録':draft?.name||draft?.[d.headers[0]]||'');$('form').replaceChildren();for(let id of ['new','clone','save','delete'])$(id).disabled=!w||((id==='clone'||id==='delete')&&selected<0);if(!draft)return;let grid=el('div');grid.className='fields';$('form').append(grid);for(let f of d.headers){let l=el('label',f),opts=choices(f),v=draft[f]??'',input;if(opts){input=el('input');let dl=el('datalist');dl.id='opt_'+f;for(let [value,label] of opts){let o=el('option');o.value=value;o.label=label;dl.append(o)}input.setAttribute('list',dl.id);l.append(dl)}else if(f==='text'||f.startsWith('trigger_text')){input=el('textarea');l.className='wide'}else input=el('input');input.value=v;input.disabled=!w;input.oninput=()=>{draft[f]=input.value;if(tab==='passive'&&/^(passive_type|target_id)[123]$/.test(f))refreshPassiveTargets(f.slice(-1));stats();if(tab==='form')renderFormExtras()};l.append(input);grid.append(l)}stats();renderFormExtras()}

function switchTab(t){tab=t;selected=-1;draft=null;$('search').value='';$('tabs').replaceChildren();for(let k of [...editable,...refs.filter(x=>db[x])]){let b=el('button',k);b.className=k===tab?'active':'';b.onclick=()=>switchTab(k);$('tabs').append(b)}openRow(db[tab].rows.length?0:-1)}
function validate(d,k){let errors=[],seen=new Set();for(let [i,r] of d.rows.entries()){let key=k==='character_skill'?r.character_id+'|'+r.skill_id:r[d.headers[0]];if(!r[d.headers[0]]||(k==='character_skill'&&!r.skill_id))errors.push(`${k} ${i+2}行: IDなし`);if(seen.has(key))errors.push(`${k} ${i+2}行: ID重複 ${key}`);seen.add(key);let old=tab;tab=k;for(let f of d.headers){let ref=lookup(f),v=r[f];if(ref&&db[ref[0]]?.rows.length&&v&&v!=='none'&&!db[ref[0]].rows.some(x=>x[ref[1]]===v||(ref[0]==='passive_type'&&String(x.aliases??'').split('|').includes(v))||((ref[0]==='element'||ref[0]==='species')&&x[ref[0]+'_id']===v)))errors.push(`${k} ${i+2}行 ${f}: 参照候補なし ${v}`);if(/chance\d$|^evasion_percent$|^action_failure_chance$/.test(f)&&v!==''&&(!Number.isFinite(Number(v))||Number(v)<0||Number(v)>100))errors.push(`${k} ${i+2}行 ${f}: 0〜100の範囲外`);if(['effect','battle_effect'].includes(k)&&['damage_value','turn','start_delay','stat_modifier_multiplier','zero_multiplier','max_multiplier','modifier','breakthrough_multiplier','damage_cut'].includes(f)&&v!==undefined&&v!==''&&(!Number.isFinite(Number(v))||(['turn','start_delay'].includes(f)&&(!Number.isSafeInteger(Number(v))||Number(v)<0))))errors.push(k+' '+(i+2)+'行 '+f+': 数値不正')}if(k==='battle_effect'&&r.field_target&&!['self','enemy','both'].includes(r.field_target))errors.push(k+' '+(i+2)+'行 field_target: self/enemy/both');if(k==='battle_effect'&&r.field_clearable&&!/^(true|false)$/i.test(r.field_clearable))errors.push(k+' '+(i+2)+'行 field_clearable: TRUE/FALSE');if(k==='effect'&&r.effect_group==='element_resistance_down'&&(!(Number(r.turn)>0)||!(Number(r.damage_value)>1)||!(Number(r.zero_multiplier)>0)||!(Number(r.max_multiplier)>=Number(r.zero_multiplier))||!r.element))errors.push(k+' '+(i+2)+'行: 耐性低下の設定不正');if(k==='battle_effect'&&r.battle_effect_group==='field_element_power'&&(!(Number(r.modifier)>0)||!r.element||!r.breakthrough_element||r.breakthrough_multiplier===''||!(Number(r.breakthrough_multiplier)>=0)))errors.push(k+' '+(i+2)+'行: 属性フィールドの設定不正');if(k==='battle_effect'&&r.battle_effect_group==='field_periodic_damage'&&(r.damage_type!=='percent_maxhp'||!(Number(r.damage_value)>0)))errors.push(k+' '+(i+2)+'行: 継続ダメージフィールドの設定不正');if(k==='battle_effect'&&['field_element_power','field_periodic_damage'].includes(r.battle_effect_group)&&!(Number.isSafeInteger(Number(r.turn))&&Number(r.turn)>0))errors.push(k+' '+(i+2)+'行 turn: 持続は1以上');tab=old;if(k==='effect'&&['en_charge_modifier','en_cost_modifier'].includes(r.effect_group)&&!(Number(r.turn)>0))errors.push(k+' '+(i+2)+'行 turn: 持続は1以上')}if(k==='form'){const chars=new Map(db.character.rows.map(r=>[r.character_id,r])),elements=new Map((db.element?.rows??[]).map(r=>[r.element_id,r]));for(const issue of geneOrderFormData.issues(d.rows,chars,elements))errors.push('form '+issue.id+' '+issue.field+': '+issue.value);}if(k==='passive')for(const [i,row]of d.rows.entries())for(const issue of passiveErrors(row))errors.push('passive '+(i+2)+'行 '+issue);return errors}
function fileKey(name){return name.replace(/\.csv$/i,'').replace(/(?:\s*\([^()]*\))+$/,'').trim().toLowerCase()}
let importing=false;
async function importFiles(files){if(importing)return;importing=true;let messages=[],ok=0;try{for(let f of files){let k=fileKey(f.name);if(!/\.csv$/i.test(f.name)||(!editable.includes(k)&&!refs.includes(k))){messages.push(f.name+' 対象外');continue}try{let raw=new TextDecoder('utf-8',{fatal:true,ignoreBOM:true}).decode(await f.arrayBuffer());let d=parse(raw);if(schemas[k]&&schemas[k].split(',').filter((h,i)=>k==='effect'?i<10:k==='battle_effect'?i<10:true).some(h=>!d.headers.includes(h)))throw Error('既知の必須列が不足');if(db[k]?.dirty&&!confirm(k+' の変更を破棄して読み込みますか？')){messages.push(k+' スキップ');continue}if(messages.some(m=>m.startsWith(k+'.csv ←'))&&!confirm(k+' の重複ファイルを置き換えますか？'))continue;db[k]=d;d.source=f.name;ok++;messages.push(`${k}.csv ← ${f.name}: ${d.rows.length}件`)}catch(err){messages.push(f.name+': '+err.message)}}msg(`${ok} ファイル読込成功\n`+messages.join('\n'));$('loaded').textContent='読込済み: '+Object.keys(db).filter(k=>db[k].source).map(k=>`${k} (${db[k].rows.length})`).join(' / ');switchTab(tab)}finally{importing=false}}
function requestImport(files){if(draft&&JSON.stringify(draft)!==JSON.stringify(db[tab].rows[selected])&&Object.values(draft).some(Boolean)&&!confirm('未登録の編集を破棄して読み込みますか？'))return;return importFiles(files)}
$('load').onclick=()=>$('files').click();$('dropzone').onclick=()=>$('files').click();$('dropzone').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('files').click()}};$('files').onchange=async e=>{await requestImport(Array.from(e.target.files));e.target.value=''};
window.addEventListener('dragover',e=>{if(Array.from(e.dataTransfer.types).includes('Files')){e.preventDefault();$('dropzone').classList.add('over');e.dataTransfer.dropEffect='copy'}});window.addEventListener('dragleave',e=>{if(!e.relatedTarget)$('dropzone').classList.remove('over')});window.addEventListener('drop',e=>{e.preventDefault();$('dropzone').classList.remove('over');requestImport(Array.from(e.dataTransfer.files))});
$('search').oninput=list;$('new').onclick=()=>openRow(-1);$('clone').onclick=()=>openRow(selected,true);$('reset').onclick=()=>openRow(selected);$('save').onclick=()=>{const errors=tab==='passive'?passiveErrors(draft):['effect','battle_effect','form'].includes(tab)?validate({headers:db[tab].headers,rows:[draft]},tab):[];if(errors.length){msg('検証エラー\n'+errors.join('\n'));return}let d=db[tab],id=d.headers[0];if(!draft[id]||(tab==='character_skill'&&!draft.skill_id)){msg('IDを入力してください');return}if(d.rows.some((r,i)=>i!==selected&&r[id]===draft[id]&&(tab!=='character_skill'||r.skill_id===draft.skill_id))){msg('ID重複');return}if(selected<0){d.rows.push({...draft});selected=d.rows.length-1}else d.rows[selected]={...draft};d.dirty=true;list();renderForm();msg('登録しました。CSV出力で保存してください。')};$('delete').onclick=()=>{if(selected<0||!confirm('選択行を削除しますか？ 参照先は自動変更されません。'))return;db[tab].rows.splice(selected,1);db[tab].dirty=true;openRow(-1);msg('削除しました。整合性チェックを実行してください。')};$('check').onclick=()=>{let errors=editable.flatMap(k=>validate(db[k],k));msg(errors.length?`警告 ${errors.length}件\n`+errors.join('\n'):'検出対象の不整合はありません。未読込の参照マスターは検査対象外です。')};$('export').onclick=()=>{let d=db[tab];if(draft&&JSON.stringify(draft)!==JSON.stringify(d.rows[selected])&&Object.values(draft).some(Boolean)&&!confirm('未登録の編集は出力に含まれません。続行？'))return;let a=el('a');a.href=URL.createObjectURL(new Blob([serialize(d)],{type:'text/csv;charset=utf-8'}));a.download=tab+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};window.addEventListener('beforeunload',e=>{if(Object.values(db).some(d=>d.dirty)){e.preventDefault();e.returnValue=''}});switchTab(tab);
</script></html>
